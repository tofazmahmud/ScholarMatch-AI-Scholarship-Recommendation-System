name: ScholarMatch PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-checks:
    name: PHP Lint, Tests & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: xdebug
          tools: composer

      - name: Show PHP version
        run: php -v

      - name: Ensure evidence directory exists
        run: mkdir -p ci-results

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist || true

      - name: Check PHP syntax for all tracked source files
        shell: bash
        run: |
          git ls-files -z '*.php' | while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done

      - name: Run matching and CV logic tests
        run: php tests/logic.php | tee ci-results/logic_tests.log

      - name: Run admin component smoke test
        run: php tests/admin_core_smoke.php | tee ci-results/admin_smoke.log

      - name: Run student authentication static smoke test
        run: php tests/student_account_static_smoke.php | tee ci-results/student_smoke.log

      - name: Execute all test checks (54 cases)
        run: php tests/ci_50.php | tee ci-results/ci_50_output.txt

      - name: Dependency audit
        run: |
          if [ -f composer.lock ]; then
            composer audit --no-interaction | tee ci-results/dependency_audit.log || true
          else
            echo "No composer.lock; audit skipped" | tee ci-results/dependency_audit.log
          fi

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload CI evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholarmatch-ci-evidence
          path: ci-results/
          retention-days: 30
